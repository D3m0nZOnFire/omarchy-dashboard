# qmllint settings, used by CI (.github/workflows/qmllint.yml) and by
# running `qmllint -I . *.qml tiles/*.qml` locally. Only the overrides are
# listed; everything else stays at qmllint's defaults.

[Warnings]
# Tiles and widgets read their root's properties (theme, shell, metrics...)
# from nested objects without a `root.` prefix, which is valid QML but
# reported on almost every binding. Real typos still fail at runtime with a
# ReferenceError in `qs -c dashboard`'s log.
UnqualifiedAccess=disable
# `var` inside a block (loops, try) is hoisted to function scope. It's
# harmless everywhere it's used here; new code should use let/const.
BlockScopeVarDeclaration=disable
